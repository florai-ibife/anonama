<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous Peer Support</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .dashboard {
      width: 90%;
      max-width: 600px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .header {
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      background-color: #10b981;
      color: #064e3b;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .chat-box {
      height: 300px;
      overflow-y: auto;
      background-color: #0f172a;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message-bubble {
      background-color: #334155;
      padding: 10px 15px;
      border-radius: 15px 15px 15px 2px;
      max-width: 80%;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .input-area {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: white;
      outline: none;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background-color: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="header">
      <h2 style="margin: 0; font-size: 1.2rem;">Peer Support Terminal</h2>
      <span class="status-badge">● LIVE</span>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type an anonymous message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <!-- Firebase Live Connection Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAVQVwnQcF-zyWLVw3J-5ul2FX6O-8VnVo",
      authDomain: "anonama-9973f.firebaseapp.com",
      databaseURL: "https://anonama-9973f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "anonama-9973f",
      storageBucket: "anonama-9973f.firebasestorage.app",
      messagingSenderId: "1050497729249",
      appId: "1:1050497729249:web:04254e34a32bad16502da0"
    };

    // Initialize Firebase & Realtime Database
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, "messages");

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    // Function to send a message to Firebase
    function sendMessage() {
      const text = messageInput.value.trim();
      if (text !== "") {
        push(messagesRef, {
          text: text,
          timestamp: Date.now()
        });
        messageInput.value = "";
      }
    }

    // Send on button click or Enter key
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Listen for new messages in real time and display them
    onChildAdded(messagesRef, (snapshot) => {
      const data = snapshot.val();
      const bubble = document.createElement("div");
      bubble.className = "message-bubble";
      bubble.innerHTML = `<strong>Peer:</strong> `;
      
      // Use textContent for the user's message to prevent HTML injection
      const msgText = document.createTextNode(data.text);
      bubble.appendChild(msgText);
      
      chatBox.appendChild(bubble);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>

</body>
</html>
